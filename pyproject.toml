[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lanpad"
version = "0.1.0"
description = "Телефон как тачпад, клавиатура и пульт для компьютера в локальной сети"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "midixyz" }]
keywords = ["touchpad", "remote", "mouse", "keyboard", "mpris", "lan", "wayland"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "evdev>=1.7",
    "dbus-next>=0.2.3",
    "qrcode>=7.4",
    "pypng>=0.20220715",
]

[project.urls]
Homepage = "https://github.com/midixyz/lanpad"
Source = "https://github.com/midixyz/lanpad"
Issues = "https://github.com/midixyz/lanpad/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lanpad = "lanpad.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lanpad = ["web/**/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
